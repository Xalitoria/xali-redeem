# The voucher menu, opened by /redeem. XaliRedeem writes this file when it is missing (menu.write-menu), and it is a plain XaliMenu
# menu from then on: change the look freely, a `material` can be any item (nexo:<id>, itemsadder:<id>).
#
# Every voucher the player can see is one element of the `xaliredeem:vouchers` catalog and is drawn as the `item` below. The element
# has {id}, {name}, {material}, {amount} (how many they hold), {redeemed} and {ready} (true or false). XaliMenu shows values of
# an element as plain text, so what has colors (the name, the description, the status) comes from PlaceholderAPI instead:
#   %xaliredeem_name_<id>%, %xaliredeem_description_<id>_<line>%, %xaliredeem_status_<id>%
# The `xaliredeem:redeem` action redeems the voucher named by `voucher`.
title = "&8Vouchers &7({page}/{pages})"
size = 54
register = false
# Draw again every 5 seconds, so cooldowns count down and what changes on another server shows.
refresh = 5s
# The border; the `x` cells are where `pages` puts the vouchers, `p` is left blank.
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "####p####"]
legend { "#" = border }
pages {
  catalog { type = "xaliredeem:vouchers" }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "####p####"]
  cell = "x"
  item {
    material = "{material}"
    name = "%xaliredeem_name_{id}%"
    lore = ["%xaliredeem_description_{id}_1%", "%xaliredeem_description_{id}_2%", "", "&7Held: &f{amount}", "%xaliredeem_status_{id}%"]
    update = true
    click.any.actions = [{ type = "xaliredeem:redeem", voucher = "{id}" }]
  }
  empty {
    material = "barrier"
    name = "&cNo vouchers"
    lore = ["&7You have nothing to redeem right now."]
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  prev {
    material = "arrow"
    slot = 45
    name = "&aPrevious page"
    lore = ["&7Page {page_prev}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  next {
    material = "arrow"
    slot = 53
    name = "&aNext page"
    lore = ["&7Page {page_next}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
  close { material = "barrier", slot = 49, name = "&cClose", click.any.actions = [{ type = "close" }] }
}
